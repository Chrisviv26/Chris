<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cash">
<meta name="theme-color" content="#0f172a">
<link id="touchIcon" rel="apple-touch-icon">
<link id="manifest" rel="manifest">
<title>Cash</title>
<style>
  :root{--ink:#0f172a;--slate:#475569;--muted:#94a3b8;--line:#e2e8f0;--paper:#f6f7f9;
    --card:#fff;--green:#059669;--rose:#e11d48;--amber:#b45309;--accent:#4f46e5;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--paper);color:var(--ink);padding-bottom:env(safe-area-inset-bottom);-webkit-font-smoothing:antialiased;}
  .wrap{max-width:520px;margin:0 auto;}
  header{background:linear-gradient(160deg,#0f172a,#1e293b);color:#fff;
    padding:calc(env(safe-area-inset-top) + 18px) 20px 20px;border-radius:0 0 22px 22px;
    position:sticky;top:0;z-index:20;box-shadow:0 6px 20px rgba(15,23,42,.18);}
  .month-row{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:14px;}
  .month-row button{background:rgba(255,255,255,.12);color:#fff;border:none;width:34px;height:34px;border-radius:10px;font-size:18px;line-height:1;}
  .month-row .m{font-size:15px;font-weight:600;letter-spacing:.2px;min-width:120px;text-align:center;}
  .stats{display:flex;gap:10px;}
  .stat{flex:1;background:rgba(255,255,255,.08);border-radius:14px;padding:11px 12px;}
  .stat .k{font-size:11px;color:#cbd5e1;text-transform:uppercase;letter-spacing:.5px;}
  .stat .v{font-size:19px;font-weight:700;margin-top:3px;font-variant-numeric:tabular-nums;}
  .v.in{color:#6ee7b7;}.v.out{color:#fda4af;}.v.save{color:#fff;}
  #installChip{display:none;margin:12px auto 0;background:#fff;color:#0f172a;border:none;
    padding:8px 14px;border-radius:999px;font-size:13px;font-weight:700;}
  main{padding:16px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 1px 2px rgba(15,23,42,.04);}
  .amount-wrap{display:flex;align-items:center;border-bottom:2px solid var(--line);padding:4px 2px 8px;}
  .amount-wrap span{font-size:30px;font-weight:700;color:var(--muted);margin-right:6px;}
  #amount{border:none;outline:none;font-size:34px;font-weight:700;width:100%;font-variant-numeric:tabular-nums;color:var(--ink);background:transparent;}
  .seg{display:flex;background:var(--paper);border-radius:12px;padding:4px;margin:14px 0;}
  .seg button{flex:1;border:none;background:transparent;padding:10px;border-radius:9px;font-size:14px;font-weight:600;color:var(--slate);}
  .seg button.on-out{background:var(--rose);color:#fff;}
  .seg button.on-in{background:var(--green);color:#fff;}
  .field{margin-top:12px;}
  .field label{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px;}
  .field input,.field select{width:100%;border:1px solid var(--line);border-radius:12px;padding:13px 14px;font-size:16px;color:var(--ink);background:#fff;outline:none;}
  .field input:focus,.field select:focus{border-color:var(--accent);}
  .cat-hint{font-size:11px;color:var(--muted);margin-left:6px;font-weight:400;text-transform:none;letter-spacing:0;}
  .add-btn{width:100%;margin-top:16px;background:var(--ink);color:#fff;border:none;padding:16px;border-radius:14px;font-size:16px;font-weight:700;letter-spacing:.2px;}
  .add-btn:active{transform:translateY(1px);}
  .list-head{display:flex;align-items:center;justify-content:space-between;margin:22px 4px 8px;}
  .list-head h2{font-size:14px;color:var(--slate);margin:0;font-weight:700;}
  .daygroup{margin-bottom:14px;}
  .daylabel{font-size:12px;color:var(--muted);font-weight:600;margin:0 4px 6px;display:flex;justify-content:space-between;}
  .entry{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px;}
  .dot{width:10px;height:10px;border-radius:50%;flex:none;}
  .entry .body{flex:1;min-width:0;}
  .entry .desc{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .entry .meta{font-size:12px;color:var(--muted);margin-top:1px;}
  .entry .amt{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;flex:none;}
  .entry .amt.out{color:var(--ink);}.entry .amt.in{color:var(--green);}
  .entry .del{border:none;background:transparent;color:var(--muted);font-size:16px;padding:4px 2px 4px 8px;}
  .empty{text-align:center;color:var(--muted);font-size:14px;padding:40px 20px;}
  .export{position:sticky;bottom:0;background:rgba(246,247,249,.92);backdrop-filter:blur(8px);
    border-top:1px solid var(--line);padding:12px 16px calc(env(safe-area-inset-bottom) + 12px);display:flex;gap:10px;}
  .export button{flex:1;border:1px solid var(--line);background:#fff;color:var(--ink);padding:13px;border-radius:12px;font-size:13px;font-weight:600;}
  .export button.primary{background:var(--accent);color:#fff;border-color:var(--accent);}
  .badge{display:inline-block;min-width:18px;padding:0 5px;height:18px;line-height:18px;font-size:11px;background:var(--amber);color:#fff;border-radius:9px;margin-left:5px;font-weight:700;}
  .toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:12px;font-size:13px;opacity:0;transition:opacity .25s;z-index:50;max-width:90%;text-align:center;}
  .toast.show{opacity:1;}
  .tiny{font-size:11px;color:var(--muted);text-align:center;padding:6px 16px 2px;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="month-row">
      <button id="prevM" aria-label="Previous month">‹</button>
      <div class="m" id="monthLabel">—</div>
      <button id="nextM" aria-label="Next month">›</button>
    </div>
    <div class="stats">
      <div class="stat"><div class="k">In</div><div class="v in" id="sumIn">$0</div></div>
      <div class="stat"><div class="k">Out</div><div class="v out" id="sumOut">$0</div></div>
      <div class="stat"><div class="k">Saved</div><div class="v save" id="sumNet">$0</div></div>
    </div>
    <button id="installChip">⤓ Install app</button>
  </header>

  <main>
    <div class="card">
      <div class="amount-wrap"><span>$</span><input id="amount" type="number" inputmode="decimal" placeholder="0.00" step="0.01"></div>
      <div class="seg">
        <button id="segOut" class="on-out">Spent</button>
        <button id="segIn">Money in</button>
      </div>
      <div class="field"><label>What was it?</label>
        <input id="desc" type="text" placeholder="e.g. New World, Z petrol, AT HOP" autocomplete="off"></div>
      <div class="field"><label>Category <span class="cat-hint" id="catHint">auto</span></label>
        <select id="category"></select></div>
      <div class="field"><label>Date</label><input id="date" type="date"></div>
      <button class="add-btn" id="addBtn">Add</button>
    </div>

    <div class="list-head"><h2>Entries this month</h2><span class="tiny" id="count"></span></div>
    <div id="list"></div>
  </main>

  <div class="export">
    <button id="sendBtn" class="primary">Send to laptop<span class="badge" id="newBadge" style="display:none">0</span></button>
    <button id="copyBtn">Copy for Excel</button>
    <button id="moreBtn">•••</button>
  </div>
  <div class="tiny">Everything is saved on this phone. Weekly: tap <b>Send to laptop</b>, then paste into the Excel <b>Add</b> tab.</div>
</div>
<div class="toast" id="toast"></div>

<script>
"use strict";
var KEY="cashsync:v1";
function load(){try{var s=localStorage.getItem(KEY);return s?JSON.parse(s):[];}catch(e){return window.__mem||[];}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(entries));}catch(e){window.__mem=entries;}}

var CATS=["Home","Groceries","Dining Out","Fuel","Transport","Utilities","Internet & Streaming",
  "Insurance","Health","Personal","Gifts","Subscriptions","Household","Clothing","Travel","Debt","Other"];
var COLORS={Home:"#4f46e5",Groceries:"#0d9488","Dining Out":"#db2777",Fuel:"#ea580c",Transport:"#d97706",
  Utilities:"#0891b2","Internet & Streaming":"#7c3aed",Insurance:"#2563eb",Health:"#dc2626",Personal:"#c026d3",
  Gifts:"#e11d48",Subscriptions:"#9333ea",Household:"#65a30d",Clothing:"#059669",Travel:"#0284c7",Debt:"#b91c1c",
  Income:"#059669",Other:"#64748b"};
var RULES=[
  ["Home",["rent","mortgage","landlord","body corp"," rates","property manag"]],
  ["Utilities",["power","electric","genesis","mercury","contact energy","meridian","watercare","gas bill","nova energy","electric kiwi"]],
  ["Internet & Streaming",["spark","vodafone","one nz","2degrees","netflix","spotify","disney","neon","internet","broadband","skinny","slingshot"]],
  ["Insurance",["insurance","aa insur","tower","southern cross","partners life"]],
  ["Groceries",["new world","countdown","woolworths","pak n save","paknsave","four square","fresh choice","supermarket","grocer","butcher"]],
  ["Fuel",[" z ","z energy"," bp ","mobil","gull","caltex","waitomo"," npd ","petrol"," fuel "]],
  ["Dining Out",["cafe","restaurant","mcdonald","kfc","burger","pizza","uber eats","sushi","dining"," coffee"," bar ","pub","takeaway","bakery","dominos","nando"]],
  ["Transport",["at hop","athop"," bus "," uber","taxi","ferry","parking"," wof "," rego "]],
  ["Health",["pharmacy","chemist","doctor"," gp ","medical","dental","physio","prescription","unichem","optometrist"]],
  ["Personal",["salon","spa","barber","haircut","beauty","nails","brows","horse","riding","equestrian"]],
  ["Gifts",["gift","present","birthday","flowers","florist"]],
  ["Subscriptions",["subscription","membership","gym","patreon","icloud","google one","microsoft","adobe","les mills"]],
  ["Household",["kmart"," warehouse","bunnings","mitre 10","briscoes","ikea","harvey norman","noel leeming","appliance"]],
  ["Clothing",["clothing","shoes","cotton on","hallenstein","glassons","uniqlo","barkers"," farmers"]],
  ["Travel",["flight","air nz","jetstar","hotel","airbnb","booking.com","vacation","holiday","expedia"]],
  ["Debt",[" loan","credit card","repayment","afterpay","laybuy"," zip ","gem visa","q card"," interest"]]
];
function guess(desc){var d=" "+(desc||"").toLowerCase()+" ",hit="Other";
  for(var i=0;i<RULES.length;i++)for(var j=0;j<RULES[i][1].length;j++)if(d.indexOf(RULES[i][1][j])>=0)hit=RULES[i][0];
  return hit;}

var entries=load();
var view=new Date();view.setDate(1);
var catTouched=false;
function fmt(n){return "$"+Math.round(n).toLocaleString("en-NZ");}
function fmt2(n){return "$"+Number(n).toLocaleString("en-NZ",{minimumFractionDigits:2,maximumFractionDigits:2});}
function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function monthKey(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");}
var MO=["January","February","March","April","May","June","July","August","September","October","November","December"];
var WD=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
var $=function(id){return document.getElementById(id);};
var amountEl=$("amount"),descEl=$("desc"),catEl=$("category"),dateEl=$("date");
var kind="expense";
CATS.forEach(function(c){var o=document.createElement("option");o.value=c;o.textContent=c;catEl.appendChild(o);});
dateEl.value=iso(new Date());

function setKind(k){kind=k;
  $("segOut").className=k==="expense"?"on-out":"";
  $("segIn").className=k==="income"?"on-in":"";
  if(k==="income"&&!catTouched)catEl.value="Income";else if(!catTouched)catEl.value=guess(descEl.value);}
$("segOut").onclick=function(){setKind("expense");};
$("segIn").onclick=function(){setKind("income");};
descEl.addEventListener("input",function(){if(!catTouched&&kind==="expense"){catEl.value=guess(descEl.value);$("catHint").textContent="auto";}});
catEl.addEventListener("change",function(){catTouched=true;$("catHint").textContent="you set this";});

$("addBtn").onclick=function(){
  var amt=parseFloat(amountEl.value);
  if(!amt||amt<=0){toast("Enter an amount");amountEl.focus();return;}
  if(!descEl.value.trim()){toast("Add a short description");descEl.focus();return;}
  entries.push({id:Date.now()+"-"+Math.random().toString(36).slice(2,6),date:dateEl.value,
    desc:descEl.value.trim(),amount:amt,kind:kind,cat:kind==="income"?"Income":catEl.value,exported:false});
  save();
  amountEl.value="";descEl.value="";catTouched=false;setKind("expense");$("catHint").textContent="auto";
  var dd=new Date(dateEl.value+"T00:00:00");view=new Date(dd.getFullYear(),dd.getMonth(),1);
  render();toast("Added");amountEl.focus();
};
$("prevM").onclick=function(){view.setMonth(view.getMonth()-1);render();};
$("nextM").onclick=function(){view.setMonth(view.getMonth()+1);render();};
function del(id){entries=entries.filter(function(e){return e.id!==id;});save();render();}

function render(){
  $("monthLabel").textContent=MO[view.getMonth()]+" "+view.getFullYear();
  var mk=monthKey(view);
  var mine=entries.filter(function(e){return (e.date||"").slice(0,7)===mk;})
                  .sort(function(a,b){return a.date<b.date?1:a.date>b.date?-1:0;});
  var inSum=0,outSum=0;
  mine.forEach(function(e){if(e.kind==="income")inSum+=e.amount;else outSum+=e.amount;});
  $("sumIn").textContent=fmt(inSum);$("sumOut").textContent=fmt(outSum);$("sumNet").textContent=fmt(inSum-outSum);
  $("count").textContent=mine.length?(mine.length+" entries"):"";
  var list=$("list");list.innerHTML="";
  if(!mine.length)list.innerHTML='<div class="empty">Nothing yet this month.<br>Add your first entry above.</div>';
  var groups={};mine.forEach(function(e){(groups[e.date]=groups[e.date]||[]).push(e);});
  Object.keys(groups).sort().reverse().forEach(function(dk){
    var d=new Date(dk+"T00:00:00");var g=document.createElement("div");g.className="daygroup";
    var dayOut=groups[dk].reduce(function(s,e){return s+(e.kind==="income"?0:e.amount);},0);
    var lab=document.createElement("div");lab.className="daylabel";
    lab.innerHTML="<span>"+WD[d.getDay()]+" "+d.getDate()+" "+MO[d.getMonth()].slice(0,3)+"</span><span>"+(dayOut?("−"+fmt(dayOut)):"")+"</span>";
    g.appendChild(lab);
    groups[dk].forEach(function(e){
      var row=document.createElement("div");row.className="entry";var col=COLORS[e.cat]||"#64748b";
      row.innerHTML='<span class="dot" style="background:'+col+'"></span>'+
        '<div class="body"><div class="desc">'+escapeHtml(e.desc)+'</div>'+
        '<div class="meta">'+e.cat+(e.exported?' · synced':'')+'</div></div>'+
        '<div class="amt '+(e.kind==="income"?"in":"out")+'">'+(e.kind==="income"?"+":"−")+fmt2(e.amount)+'</div>'+
        '<button class="del" aria-label="Delete">✕</button>';
      row.querySelector(".del").onclick=function(){del(e.id);};g.appendChild(row);
    });
    list.appendChild(g);
  });
  var newCount=entries.filter(function(e){return !e.exported;}).length;
  var badge=$("newBadge");
  if(newCount>0){badge.style.display="inline-block";badge.textContent=newCount;}else badge.style.display="none";
}
function escapeHtml(s){return s.replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}

function rowsTSV(list){return list.map(function(e){
  return [e.date,e.desc,e.amount.toFixed(2),e.kind==="income"?"income":"expense"].join("\t");}).join("\n");}
function csvEntry(list){return "Date,Description,Amount,In/Out\n"+list.map(function(e){
  return [e.date,'"'+e.desc.replace(/"/g,'""')+'"',e.amount.toFixed(2),
    e.kind==="income"?"income":"expense"].join(",");}).join("\n");}
function csvAll(list){return "Date,Description,Amount,In/Out,Category\n"+list.map(function(e){
  return [e.date,'"'+e.desc.replace(/"/g,'""')+'"',e.amount.toFixed(2),
    e.kind==="income"?"income":"expense",e.cat].join(",");}).join("\n");}

/* weekly send: share only NEW entries as a CSV file, mark synced on success */
$("sendBtn").onclick=function(){
  var neu=entries.filter(function(e){return !e.exported;});
  if(!neu.length){toast("Nothing new to send");return;}
  var csv=csvEntry(neu.slice().sort(function(a,b){return a.date<b.date?-1:1;}));
  var fname="cash_new_"+iso(new Date())+".csv";
  var file;try{file=new File([csv],fname,{type:"text/csv"});}catch(e){file=null;}
  if(navigator.canShare&&file&&navigator.canShare({files:[file]})){
    navigator.share({files:[file],title:"Cash entries",text:"New expense entries"}).then(function(){
      neu.forEach(function(e){e.exported=true;});save();render();toast("Sent — "+neu.length+" new");
    }).catch(function(){/* cancelled: leave unsynced */});
  } else { // fallback: download the file
    downloadBlob(csv,fname);
    neu.forEach(function(e){e.exported=true;});save();render();
    toast("Saved "+neu.length+" new — move the file to your laptop");
  }
};
$("copyBtn").onclick=function(){
  var neu=entries.filter(function(e){return !e.exported;});
  if(!neu.length){toast("No new entries to copy");return;}
  copyText(rowsTSV(neu.slice().sort(function(a,b){return a.date<b.date?-1:1;})),function(ok){
    if(ok){neu.forEach(function(e){e.exported=true;});save();render();
      toast(neu.length+" copied — paste into the Add tab");}
    else toast("Copy failed — use Send instead");});
};
$("moreBtn").onclick=function(){
  var neu=entries.filter(function(e){return !e.exported;}).length;
  var c=prompt("Cash — "+entries.length+" entries, "+neu+" not yet synced.\n\n"+
    "1 = Download FULL backup CSV\n2 = Mark all as synced\n3 = Mark all as new (re-send everything)\n4 = Delete all data\n\nType a number:","");
  if(c==="1"){downloadBlob(csvAll(entries.slice().sort(function(a,b){return a.date<b.date?-1:1;})),"cash_backup_"+iso(new Date())+".csv");toast("Backup downloaded");}
  else if(c==="2"){entries.forEach(function(e){e.exported=true;});save();render();toast("All marked synced");}
  else if(c==="3"){entries.forEach(function(e){e.exported=false;});save();render();toast("All marked new");}
  else if(c==="4"){if(confirm("Delete ALL entries on this phone? Cannot be undone.")){entries=[];save();render();toast("Cleared");}}
};
function downloadBlob(text,name){var b=new Blob([text],{type:"text/csv"});var a=document.createElement("a");
  a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();a.remove();}
function copyText(text,cb){
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(text).then(function(){cb(true);},fallback);
  else fallback();
  function fallback(){try{var ta=document.createElement("textarea");ta.value=text;ta.style.position="fixed";ta.style.opacity="0";
    document.body.appendChild(ta);ta.focus();ta.select();var ok=document.execCommand("copy");ta.remove();cb(ok);}catch(e){cb(false);}}
}
var toastT;
function toast(m){var t=$("toast");t.textContent=m;t.className="toast show";clearTimeout(toastT);toastT=setTimeout(function(){t.className="toast";},1900);}

/* ---------- make it installable: generate icon + manifest ---------- */
(function(){
  function icon(size){
    var c=document.createElement("canvas");c.width=c.height=size;var x=c.getContext("2d");
    var g=x.createLinearGradient(0,0,size,size);g.addColorStop(0,"#0f172a");g.addColorStop(1,"#1e293b");
    x.fillStyle=g;var r=size*0.22;
    x.beginPath();x.moveTo(r,0);x.arcTo(size,0,size,size,r);x.arcTo(size,size,0,size,r);
    x.arcTo(0,size,0,0,r);x.arcTo(0,0,size,0,r);x.closePath();x.fill();
    // little bars + dollar motif
    x.fillStyle="#6ee7b7";var bw=size*0.1,bx=size*0.24,by=size*0.66;
    x.fillRect(bx,by-size*0.14,bw,size*0.14);
    x.fillStyle="#818cf8";x.fillRect(bx+bw*1.5,by-size*0.24,bw,size*0.24);
    x.fillStyle="#fda4af";x.fillRect(bx+bw*3,by-size*0.34,bw,size*0.34);
    x.fillStyle="#fff";x.font="bold "+(size*0.4)+"px -apple-system,Arial";x.textAlign="center";x.textBaseline="middle";
    x.fillText("$",size*0.5,size*0.34);
    return c.toDataURL("image/png");
  }
  try{
    var i180=icon(180),i512=icon(512);
    document.getElementById("touchIcon").href=i180;
    var man={name:"Cash Capture",short_name:"Cash",description:"Log expenses and income on the go",
      display:"standalone",background_color:"#f6f7f9",theme_color:"#0f172a",
      start_url:location.href.split("#")[0],scope:".",
      icons:[{src:i180,sizes:"180x180",type:"image/png"},{src:i512,sizes:"512x512",type:"image/png",purpose:"any maskable"}]};
    var burl=URL.createObjectURL(new Blob([JSON.stringify(man)],{type:"application/manifest+json"}));
    document.getElementById("manifest").href=burl;
  }catch(e){}
})();

/* Android install prompt */
var deferredPrompt=null;
window.addEventListener("beforeinstallprompt",function(e){e.preventDefault();deferredPrompt=e;
  var chip=$("installChip");chip.style.display="inline-block";
  chip.onclick=function(){chip.style.display="none";deferredPrompt.prompt();deferredPrompt=null;};});

setKind("expense");
render();
</script>
</body>
</html>
